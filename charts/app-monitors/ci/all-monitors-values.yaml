team: example-team
app: example-app
env: prod-example
repository: example-repo
extraTags:
  - "extra:example"
scope:
  kubeNamespace: example-namespace
  sqsQueues:
    - example-queue
monitors:
  oomKilled:
    critical: 2
    warning: 1
    priority: 2
    severity: warning
  crashLoopBackOff:
    enabled: true
  imagePullBackOff:
    enabled: true
  cpuThrottling:
    enabled: true
  memoryOverRequest:
    enabled: true
  replicasAvailableLow:
    enabled: true
  hpaMaxedOut:
    enabled: true
  hpaReplicasSurge:
    enabled: true
  pdbNoDisruptionsAllowed:
    enabled: true
  http50xErrors:
    enabled: true
  sqsOldestMessageAge:
    enabled: true
  sqsBacklog:
    enabled: true
