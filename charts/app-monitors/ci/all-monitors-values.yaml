team: example-team
app: example-app
env: prod-example
repository: example-repo
extraTags:
  - "extra:example"
scope:
  kubeNamespace: example-namespace
  sqsQueues:
    - example-queue
monitors:
  oomKilled:
    critical: 2
    warning: 1
    priority: 2
    severity: warning
  hpaMaxedOut:
    enabled: true
  sqsOldestMessageAge:
    enabled: true
  sqsBacklog:
    enabled: true
