suite: workload monitors
templates:
  - datadogmonitor-workload.yaml
values:
  - ../ci/all-monitors-values.yaml
tests:
  - it: renders the three default workload monitors
    set:
      monitors.crashLoopBackOff.enabled: false
      monitors.imagePullBackOff.enabled: false
      monitors.cpuThrottling.enabled: false
      monitors.memoryOverRequest.enabled: false
      monitors.replicasAvailableLow.enabled: false
    asserts:
      - hasDocuments:
          count: 3
      - isKind:
          of: DatadogMonitor

  - it: names the resource <app>-<env>-<signal>
    documentIndex: 0
    asserts:
      - equal:
          path: spec.type
          value: query alert
      - equal:
          path: metadata.name
          value: example-app-prod-example-pod-restarts

  - it: builds query and critical threshold from the same value
    set:
      monitors.podRestarts.critical: 7
    documentIndex: 0
    asserts:
      - matchRegex:
          path: spec.query
          pattern: "\\{kube_namespace:example-namespace\\} by \\{aws_account_alias,kube_cluster_name,kube_deployment\\} > 7$"
      - equal:
          path: spec.options.thresholds.critical
          value: "7"

  - it: prefixes the title with env
    documentIndex: 0
    asserts:
      - equal:
          path: spec.name
          value: "[prod-example] example-app - Pod restarts - {{kube_deployment.name}}"

  - it: carries the routing tags and extra tags
    documentIndex: 0
    asserts:
      - equal:
          path: spec.tags
          value:
            - "team:example-team"
            - "env:prod-example"
            - "service:example-app"
            - "repository:example-repo"
            - "managed-by:app-monitors"
            - "extra:example"

  - it: renders only the critical threshold by default
    documentIndex: 0
    asserts:
      - notExists:
          path: spec.options.thresholds.warning

  - it: renders the warning threshold when set
    set:
      monitors.podRestarts.warning: 1
    documentIndex: 0
    asserts:
      - equal:
          path: spec.options.thresholds.warning
          value: "1"

  - it: renders no priority by default
    documentIndex: 0
    asserts:
      - notExists:
          path: spec.priority

  - it: renders the priority when set
    set:
      monitors.podRestarts.priority: 2
    documentIndex: 0
    asserts:
      - equal:
          path: spec.priority
          value: 2

  - it: renders nothing for a disabled monitor
    set:
      monitors.podRestarts.enabled: false
      monitors.oomKilled.enabled: false
      monitors.crashLoopBackOff.enabled: false
    asserts:
      - hasDocuments:
          count: 5

  - it: fails without team
    set:
      team: ""
    asserts:
      - failedTemplate:
          errorMessage: "app-monitors: .Values.team is required (routing tag)"

  - it: adds the severity tag when set
    set:
      monitors.podRestarts.severity: warning
    documentIndex: 0
    asserts:
      - contains:
          path: spec.tags
          content: "severity:warning"

  - it: renders without extra tags
    set:
      extraTags: []
    asserts:
      - hasDocuments:
          count: 8

  - it: fails without repository
    set:
      repository: ""
    asserts:
      - failedTemplate:
          errorMessage: "app-monitors: .Values.repository is required (routing tag)"

  - it: fails without a kube namespace
    set:
      scope.kubeNamespace: ""
    asserts:
      - failedTemplate:
          errorMessage: "app-monitors: .Values.scope.kubeNamespace is required by the workload, HPA and PDB monitors"

  - it: alerts on containers waiting in CrashLoopBackOff
    documentIndex: 3
    asserts:
      - equal:
          path: metadata.name
          value: example-app-prod-example-crash-loop-back-off
      - equal:
          path: spec.query
          value: "max(last_10m):max:kubernetes_state.container.status_report.count.waiting{reason:crashloopbackoff AND kube_namespace:example-namespace} by {aws_account_alias,kube_cluster_name,kube_deployment} >= 1"
      - equal:
          path: spec.options.thresholds.critical
          value: "1"
      - notExists:
          path: spec.options.thresholds.warning
      - notExists:
          path: spec.priority

  - it: alerts on containers waiting in ImagePullBackOff
    documentIndex: 4
    asserts:
      - equal:
          path: metadata.name
          value: example-app-prod-example-image-pull-back-off
      - equal:
          path: spec.query
          value: "max(last_10m):max:kubernetes_state.container.status_report.count.waiting{reason:imagepullbackoff AND kube_namespace:example-namespace} by {aws_account_alias,kube_cluster_name,kube_deployment} >= 1"
      - equal:
          path: spec.options.thresholds.critical
          value: "1"
      - notExists:
          path: spec.options.thresholds.warning
      - notExists:
          path: spec.priority

  - it: alerts on CPU throttling above a fractional threshold
    documentIndex: 5
    asserts:
      - equal:
          path: metadata.name
          value: example-app-prod-example-cpu-throttling
      - equal:
          path: spec.query
          value: "avg(last_15m):sum:kubernetes.cpu.cfs.throttled.seconds{kube_namespace:example-namespace} by {aws_account_alias,kube_cluster_name,kube_deployment} > 0.6"
      - equal:
          path: spec.options.thresholds.critical
          value: "0.6"
      - notExists:
          path: spec.options.thresholds.warning
      - notExists:
          path: spec.priority

  - it: alerts on memory usage above the request
    documentIndex: 6
    asserts:
      - equal:
          path: metadata.name
          value: example-app-prod-example-memory-over-request
      - equal:
          path: spec.query
          value: "avg(last_4h):((avg:kubernetes.memory.usage{kube_namespace:example-namespace} by {aws_account_alias,kube_cluster_name,kube_deployment} - avg:kubernetes.memory.requests{kube_namespace:example-namespace} by {aws_account_alias,kube_cluster_name,kube_deployment}) / avg:kubernetes.memory.requests{kube_namespace:example-namespace} by {aws_account_alias,kube_cluster_name,kube_deployment}) * 100 > 50"
      - equal:
          path: spec.options.thresholds.critical
          value: "50"
      - notExists:
          path: spec.options.thresholds.warning
      - notExists:
          path: spec.priority

  - it: alerts on a low share of available replicas
    documentIndex: 7
    asserts:
      - equal:
          path: metadata.name
          value: example-app-prod-example-replicas-available-low
      - equal:
          path: spec.query
          value: "avg(last_5m):avg:kubernetes_state.deployment.replicas_available{kube_namespace:example-namespace} by {aws_account_alias,kube_cluster_name,kube_deployment} * 100 / avg:kubernetes_state.deployment.replicas_desired{kube_namespace:example-namespace} by {aws_account_alias,kube_cluster_name,kube_deployment} < 20"
      - equal:
          path: spec.options.thresholds.critical
          value: "20"
      - notExists:
          path: spec.options.thresholds.warning
      - notExists:
          path: spec.priority
