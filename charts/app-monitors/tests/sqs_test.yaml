suite: sqs monitors
templates:
  - sqs.yaml
values:
  - ../ci/all-monitors-values.yaml
tests:
  - it: renders both SQS monitors
    asserts:
      - hasDocuments:
          count: 2

  - it: scopes on env and every queue
    set:
      scope.sqsQueues:
        - queue-a
        - queue-b
    documentIndex: 1
    asserts:
      - equal:
          path: spec.query
          value: "min(last_15m):max:aws.sqs.approximate_number_of_messages_visible{env:prod-example AND (queuename:queue-a OR queuename:queue-b)} by {env,queuename} > 50"

  - it: fails without queues
    set:
      scope.sqsQueues: []
    asserts:
      - failedTemplate:
          errorMessage: "app-monitors: .Values.scope.sqsQueues is required by the SQS monitors"
