# Values for app-monitors chart
# Shared (layer 2) Datadog monitors for one application in one environment.
# Each monitor below renders one DatadogMonitor. The query shape is fixed by the
# chart; an app only chooses which monitors to enable and tunes thresholds.

# -- Owning team. Rendered as the `team:` tag that notification rules route on. Required.
team: ""
# -- Application name. Used in resource names, the monitor title and the `service:` tag. Required.
app: ""
# -- Datadog environment, e.g. `prod-<team>`. Used in resource names, the monitor title and the `env:` tag. Required.
env: ""
# -- Repository that owns the monitors. Rendered as the `repository:` tag that notification rules route on. Required.
repository: ""
# -- Extra tags added to every monitor.
extraTags: []

scope:
  # -- Kubernetes namespace the workload, HPA and PDB monitors filter on. Required when any of them is enabled.
  kubeNamespace: ""
  # -- SQS queue names the SQS monitors filter on. Required when any of them is enabled.
  sqsQueues: []

# -- Minutes between re-notifications while a monitor stays in alert. 0 disables re-notification.
renotifyInterval: 0

# Each monitor takes these optional keys:
#   warning   threshold next to `critical`
#   priority  1 (P1) to 5 (P5)
#   severity  rendered as the `severity:` tag, e.g. `warning`; notification rules can route on it
monitors:
  # Restarts across all containers of a deployment within the window.
  podRestarts:
    # -- Enable the pod restarts monitor
    enabled: true
    window: last_15m
    critical: 3

  # Containers terminated with reason OOMKilled within the window.
  oomKilled:
    # -- Enable the OOMKilled monitor
    enabled: true
    window: last_10m
    critical: 1

  # Desired minus available replicas of a deployment, for every point in the window.
  replicasNotReady:
    # -- Enable the replicas not ready monitor
    enabled: true
    window: last_15m
    critical: 1

  # Containers waiting with reason CrashLoopBackOff at any point in the window.
  crashLoopBackOff:
    # -- Enable the CrashLoopBackOff monitor
    enabled: false
    window: last_10m
    critical: 1

  # Containers waiting with reason ImagePullBackOff at any point in the window.
  imagePullBackOff:
    # -- Enable the ImagePullBackOff monitor
    enabled: false
    window: last_10m
    critical: 1

  # CPU throttling of a deployment's containers, averaged over the window.
  cpuThrottling:
    # -- Enable the CPU throttling monitor
    enabled: false
    window: last_15m
    critical: 0.6

  # Percent by which a deployment's memory usage exceeds its request, averaged over the window.
  memoryOverRequest:
    # -- Enable the memory above request monitor
    enabled: false
    window: last_4h
    critical: 50

  # Available replicas as a percentage of desired, averaged over the window.
  replicasAvailableLow:
    # -- Enable the available replicas low monitor
    enabled: false
    window: last_5m
    critical: 20

  # HPA running at its max replicas for every point in the window.
  hpaMaxedOut:
    # -- Enable the HPA at max replicas monitor
    enabled: false
    window: last_30m

  # Percent change of an HPA's desired replicas against the previous window.
  hpaReplicasSurge:
    # -- Enable the HPA desired replicas surge monitor
    enabled: false
    window: last_1d
    critical: 100

  # Healthy pods minus the PDB's desired minimum, averaged over the window; 0 or less blocks evictions.
  pdbNoDisruptionsAllowed:
    # -- Enable the PDB allows no disruptions monitor
    enabled: false
    window: last_1h
    critical: 0

  # Age in seconds of the oldest message still in the queue.
  sqsOldestMessageAge:
    # -- Enable the SQS oldest message age monitor
    enabled: false
    window: last_10m
    critical: 60

  # Visible messages in the queue, for every point in the window.
  sqsBacklog:
    # -- Enable the SQS backlog monitor
    enabled: false
    window: last_15m
    critical: 50
