global:
  role: KarpenterNodeRole-MyCluster
  eksDiscovery:
    enabled: true
    clusterName: my-cluster
    # Discovery tags without explicit karpenter.sh/discovery value
    # Will use clusterName automatically
    tags:
      subnets:
        karpenter.sh/discovery: "shared"
      securityGroups:
        karpenter.sh/discovery: ""  # Will use "my-cluster"

nodePools:
  # Custom pool: everything not listed here is inherited from
  # `nodePools.defaults` (expireAfter, disruption, limits, requirements).
  production:
    enabled: true
    labels:
      environment: production
    nodeClassRef:
      group: karpenter.k8s.aws
      kind: EC2NodeClass
      name: production
    requirements:
      capacity-type:
        values: ["on-demand"]

ec2NodeClasses:
  production:
    enabled: true
    amiFamily: AL2023
    amiSelectorTerms:
      - alias: al2023@latest
    tags:
      Environment: production
      ManagedBy: karpenter
    metadataOptions:
      httpEndpoint: enabled
      httpProtocolIPv6: disabled
      httpPutResponseHopLimit: 1
      httpTokens: required
