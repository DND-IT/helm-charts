{{- if .Values.nodePools }}
{{- /* `nodePools.defaults` is a reserved key: shared values deep-merged
       underneath every pool. It never renders a NodePool of its own. */ -}}
{{- $defaults := dict }}
{{- if kindIs "map" .Values.nodePools.defaults }}
{{- $defaults = .Values.nodePools.defaults }}
{{- end }}
{{- if hasKey $defaults "enabled" }}
{{- fail "nodePools.defaults is a reserved key holding shared defaults merged underneath every NodePool; it never renders a NodePool of its own and must not set `enabled`. Rename your pool if you meant to declare one." }}
{{- end }}
{{- range $name, $pool := omit .Values.nodePools "defaults" }}
{{- /* Strip the list-or-map fields from the defaults copy before merging:
       mergo would otherwise be handed a map (defaults) and a list (a pool
       still using the legacy list form) for the same key. They are resolved
       explicitly by karpenter-resources.nodePoolEntries instead. */ -}}
{{- $base := omit (deepCopy $defaults) "requirements" "taints" "startupTaints" }}
{{- if kindIs "map" (index $base "disruption") }}
{{- $base = set $base "disruption" (omit (index $base "disruption") "budgets") }}
{{- end }}
{{- $nodePool := mustMergeOverwrite $base (deepCopy $pool) }}
{{- if $nodePool.enabled }}
{{- $taints := include "karpenter-resources.nodePoolEntries" (dict "defaults" $defaults "override" $pool "key" "taints") }}
{{- $startupTaints := include "karpenter-resources.nodePoolEntries" (dict "defaults" $defaults "override" $pool "key" "startupTaints") }}
{{- $requirements := include "karpenter-resources.nodePoolEntries" (dict "defaults" $defaults "override" $pool "key" "requirements") }}
{{- $disruption := default (dict) $nodePool.disruption }}
{{- $budgets := include "karpenter-resources.nodePoolEntries" (dict "defaults" (index $defaults "disruption") "override" (index $pool "disruption") "key" "budgets") }}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: {{ $name }}
  labels:
    {{- include "karpenter-resources.labels" $ | nindent 4 }}
    {{- with $nodePool.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $nodePool.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  template:
    {{- /* Guarded: a bare `metadata:` with no children renders as null, which
           the NodePool CRD rejects (`want object`). */ -}}
    {{- if or $nodePool.labels $nodePool.annotations }}
    metadata:
      {{- with $nodePool.labels }}
      labels:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $nodePool.annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    spec:
      {{- with $nodePool.nodeClassRef }}
      nodeClassRef:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- if $taints }}
      taints:
        {{- $taints | nindent 8 }}
      {{- end }}

      {{- if $startupTaints }}
      startupTaints:
        {{- $startupTaints | nindent 8 }}
      {{- end }}

      {{- if hasKey $nodePool "expireAfter" }}
      expireAfter: {{ $nodePool.expireAfter }}
      {{- end }}

      {{- if hasKey $nodePool "terminationGracePeriod" }}
      terminationGracePeriod: {{ $nodePool.terminationGracePeriod }}
      {{- end }}

      {{- if $requirements }}
      requirements:
        {{- $requirements | nindent 8 }}
      {{- end }}

  {{- if or $disruption $budgets }}
  disruption:
    {{- if hasKey $disruption "consolidationPolicy" }}
    consolidationPolicy: {{ $disruption.consolidationPolicy }}
    {{- end }}

    {{- if hasKey $disruption "consolidateAfter" }}
    consolidateAfter: {{ $disruption.consolidateAfter }}
    {{- end }}

    {{- if $budgets }}
    budgets:
      {{- $budgets | nindent 6 }}
    {{- end }}
  {{- end }}

  {{- with $nodePool.limits }}
  limits:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- if hasKey $nodePool "weight" }}
  weight: {{ $nodePool.weight }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
