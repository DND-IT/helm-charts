suite: test webapp external secret names
templates:
  - external_secret.yaml
  - deployment.yaml
set:
  externalSecrets:
    secretNames:
      - Team/My_Secret
tests:
  - it: should sanitise the ExternalSecret name and target
    template: external_secret.yaml
    asserts:
      - equal:
          path: metadata.name
          value: team-my-secret
      - equal:
          path: spec.target.name
          value: team-my-secret
      - equal:
          path: spec.dataFrom[0].extract.key
          value: Team/My_Secret

  - it: should reference the sanitised secret name in the container envFrom
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: team-my-secret
