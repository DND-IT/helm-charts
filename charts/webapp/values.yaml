# yaml-language-server: $schema=values.schema.json
# Override resource names. Default is the helm release name
nameOverride: ""

# Set replicas if scaling is not enabled
replicas: 1

# Set the number of old ReplicaSets to retain to allow rollback.
revisionHistoryLimit: 3

# Set the name of the service account to use. If not set, a default service account will be used.
serviceAccountName: ""

# Set the name of the service account to use for the deployment. If not set, a default service account will be used.
deploymentServiceAccountName: ""

# App specific configs
scale:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  # @schema type: [string, integer]
  minAvailable: 50%
  cpuThresholdPercentage: 100
  # -1 means "unset". Use positive integer to enable it.
  memoryThresholdPercentage: -1

# ["bundle", "exec", "rake", "db:create", "db:migrate"]
# command: []
command: []
# ["db:create", "db:migrate"]
args: []
env: {}
# Overwrites targetPort in the service
# port: 80

image_repo: nginx
image_tag: latest
image_pull_policy: IfNotPresent

probe:
  liveness: /
  livenessInitialDelaySeconds: 0
  livenessPeriodSeconds: 10
  livenessTimeoutSeconds: 2
  readiness: /
  readinessInitialDelaySeconds: 0
  readinessPeriodSeconds: 5
  readinessFailureThreshold: 2
  readinessTimeoutSeconds: 2
  startup:
  startupTimeoutSeconds: 1
  startupHttpHeaders:
  # -- gRPC probe port. When set, liveness, readiness and startup probes use a gRPC health check instead of httpGet (mutually exclusive with the HTTP path probes).
  grpc: {}
  #   port: 50051

service:
  # Enable the service
  enabled: true
  # Service name. If not set, the template will use the release name
  # name: ""
  # Annotations to be added to the service
  annotations: {}
  # Type of service to create
  type: ClusterIP
  # Port that the service is exposed on
  port: 80
  # Port that the target pod serves traffic on
  targetPort: 80
  # Name of the port that the service is exposed on
  portName: http
  # Zone-aware routing: set to "PreferSameZone" to keep traffic within the client's zone
  # where possible, reducing cross-AZ data transfer costs. Requires pods spread across
  # zones (see topologySpreadConstraints below) to be effective.
  trafficDistribution: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  paths: ["/"]
  pathType: Prefix  # This will effect all paths if changed
  tls: false

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

metadata:
  deploymentAnnotations: {}
  podAnnotations: {}
  hpaAnnotations: {}
  labels:
    datadog:
      env: ""
      service: ""
      version: ""

topologySpreadConstraints:
  # -- Enable pod [Topology Spread Constraints](https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/).
  # If no constraints are defined, the cluster default is used.
  # - topologyKey: topology.kubernetes.io/zone
  #   maxSkew: 5
  #   whenUnsatisfiable: ScheduleAnyway
  # - topologyKey: kubernetes.io/hostname
  #   maxSkew: 3
  #   whenUnsatisfiable: ScheduleAnyway
  - topologyKey: topology.kubernetes.io/zone
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway
  - topologyKey: kubernetes.io/hostname
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway

update:
  maxUnavailable: 0%
  maxSurge: 25%

externalSecrets:
  refreshInterval: 5m
  clusterSecretStore: aws-secretsmanager
  annotations: {}
  # secret names that should be fetched and made available to the Pods
  secretNames: []

extraEnvFrom:
  []
  # extraEnvFrom:
  #   - secretRef:
  #       name: my-secret
  #   - configMapRef:
  #       name: my-configmap

extraObjects:
  []
  # extraObjects:
  #   - apiVersion: v1
  #     kind: ConfigMap
  #     metadata:
  #       name: my-configmap
  #     data:
  #       key: value

targetGroupBinding:
  enabled: false
  targetGroupARN: ""
  annotations: {}

aws_iam_role_arn: ""

initContainer:
  enabled: false
  name: ""
  image: ""
  image_tag: ""
  command: []
  args: []
  env: {}
  extraEnvFrom: []
